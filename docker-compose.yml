name: ai-knowledge-platform

services:
  etcd:
    image: quay.io/coreos/etcd:v3.5.25
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
      ETCD_SNAPSHOT_COUNT: "50000"
    volumes:
      - etcd-data:/etcd
    command: etcd -advertise-client-urls=http://etcd:2379 -listen-client-urls=http://0.0.0.0:2379 --data-dir=/etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    image: milvusdb/minio:RELEASE.2024-12-18T13-15-44Z
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    volumes:
      - minio-data:/minio_data
    command: minio server /minio_data --console-address ":9001"
    ports:
      - "127.0.0.1:${MINIO_API_PORT:-19000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-19001}:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10

  milvus:
    image: milvusdb/milvus:v2.6.24
    command: ["milvus", "run", "standalone"]
    security_opt:
      - seccomp:unconfined
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
      MQ_TYPE: woodpecker
    volumes:
      - milvus-data:/var/lib/milvus
    ports:
      - "127.0.0.1:${MILVUS_HOST_PORT:-29530}:19530"
      - "127.0.0.1:${MILVUS_WEBUI_PORT:-19091}:9091"
    depends_on:
      etcd:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 10s
      start_period: 60s
      timeout: 5s
      retries: 15

  redis:
    image: redis:8.2-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  kafka:
    image: apache/kafka:4.1.1
    hostname: kafka
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,HOST:PLAINTEXT
      KAFKA_LISTENERS: CONTROLLER://:29093,INTERNAL://:19092,HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,HOST://localhost:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: "1"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
    volumes:
      - kafka-data:/var/lib/kafka/data
    ports:
      - "9092:9092"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      start_period: 20s
      timeout: 5s
      retries: 12

  postgres:
    image: postgres:18.1-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ai_platform}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ai-platform-local}
      POSTGRES_DB: ${POSTGRES_DB:-ai_platform}
    volumes:
      # PostgreSQL 18 在此目录下创建版本化数据目录（例如 /18/docker）。
      - postgres-data:/var/lib/postgresql
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-15432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 12

  migrate:
    image: migrate/migrate:v4.20.1
    volumes:
      - ./migrations:/migrations:ro
    command:
      - -path=/migrations
      - -database=postgres://${POSTGRES_USER:-ai_platform}:${POSTGRES_PASSWORD:-ai-platform-local}@postgres:5432/${POSTGRES_DB:-ai_platform}?sslmode=disable
      - up
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build: .
    env_file: .env
    environment:
      HTTP_ADDR: :8080
      MILVUS_ADDRESS: milvus:19530
      REDIS_ADDRESS: redis:6379
      KAFKA_BROKERS: kafka:19092
      USAGE_KAFKA_TOPIC: ${USAGE_KAFKA_TOPIC:-llm.usage.v1}
      POSTGRES_DSN: postgres://${POSTGRES_USER:-ai_platform}:${POSTGRES_PASSWORD:-ai-platform-local}@postgres:5432/${POSTGRES_DB:-ai_platform}?sslmode=disable
    ports:
      - "8080:8080"
    depends_on:
      milvus:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:8080/readyz"]
      interval: 10s
      timeout: 5s
      retries: 10

  worker:
    build: .
    entrypoint: ["/app/worker"]
    restart: unless-stopped
    env_file: .env
    environment:
      MILVUS_ADDRESS: milvus:19530
      REDIS_ADDRESS: redis:6379
      KAFKA_BROKERS: kafka:19092
      USAGE_KAFKA_TOPIC: ${USAGE_KAFKA_TOPIC:-llm.usage.v1}
    depends_on:
      milvus:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy

  usage-worker:
    build: .
    entrypoint: ["/app/usage-worker"]
    restart: unless-stopped
    environment:
      KAFKA_BROKERS: kafka:19092
      USAGE_KAFKA_TOPIC: ${USAGE_KAFKA_TOPIC:-llm.usage.v1}
      USAGE_KAFKA_GROUP: ${USAGE_KAFKA_GROUP:-ai-usage-workers}
      POSTGRES_DSN: postgres://${POSTGRES_USER:-ai_platform}:${POSTGRES_PASSWORD:-ai-platform-local}@postgres:5432/${POSTGRES_DB:-ai_platform}?sslmode=disable
    depends_on:
      kafka:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

volumes:
  etcd-data:
  minio-data:
  milvus-data:
  redis-data:
  kafka-data:
  postgres-data:
