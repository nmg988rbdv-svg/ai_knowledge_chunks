<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI 智能助理与知识库平台</title>
  <style>
    :root { color-scheme:dark; --bg:#07111f; --panel:#0f1d2e; --line:#26384d; --text:#eef6ff; --muted:#95a8bd; --brand:#58d6b6; --brand2:#6aa8ff; --danger:#ff7d88; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; font:15px/1.6 Inter,ui-sans-serif,system-ui,sans-serif; color:var(--text); background:radial-gradient(circle at 10% 0,#17344a 0,transparent 32%),var(--bg); }
    header,main { width:min(1180px,calc(100% - 32px)); margin:auto; }
    header { padding:42px 0 24px; display:flex; align-items:end; justify-content:space-between; gap:24px; }
    h1 { margin:0; font-size:clamp(28px,4vw,48px); letter-spacing:-.04em; }
    header p { margin:8px 0 0; color:var(--muted); }
    #health,.badge { padding:7px 11px; border:1px solid var(--line); border-radius:999px; color:var(--muted); white-space:nowrap; }
    main { display:grid; grid-template-columns:minmax(0,1.35fr) minmax(300px,.65fr); gap:18px; padding-bottom:48px; align-items:start; }
    section { background:color-mix(in srgb,var(--panel) 92%,transparent); border:1px solid var(--line); border-radius:18px; padding:20px; box-shadow:0 16px 50px #0005; }
    .section-head { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:14px; }
    h2 { margin:0; font-size:17px; }
    textarea,input,button { width:100%; border-radius:10px; border:1px solid var(--line); padding:11px 12px; font:inherit; }
    textarea,input { color:var(--text); background:#091523; outline:none; }
    textarea:focus,input:focus { border-color:var(--brand2); }
    textarea { resize:vertical; min-height:112px; }
    #question { min-height:142px; }
    button { background:linear-gradient(135deg,var(--brand),var(--brand2)); color:#06101b; border:0; font-weight:750; cursor:pointer; }
    button:disabled { opacity:.55; cursor:wait; }
    .row { display:grid; grid-template-columns:1fr auto; gap:10px; align-items:center; margin-top:10px; }
    .row button { width:auto; min-width:112px; }
    .stack { display:grid; gap:10px; }
    .output { margin-top:14px; min-height:160px; padding:15px; border-radius:12px; background:#08131f; border:1px solid #1a2b3e; white-space:pre-wrap; overflow:auto; color:#dcecff; }
    .detail { display:none; margin-top:12px; padding:13px; border:1px solid var(--line); border-radius:12px; background:#0a1725; white-space:pre-wrap; overflow-wrap:anywhere; }
    .detail.visible { display:block; }
    .meta,.muted { color:var(--muted); font-size:13px; }
    .meta { margin-top:9px; min-height:21px; }
    .error { color:var(--danger)!important; }
    .usage-section { grid-column:1/-1; }
    .summary-grid { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:10px; margin-bottom:16px; }
    .metric { padding:14px; border:1px solid var(--line); border-radius:12px; background:#091523; }
    .metric span { display:block; color:var(--muted); font-size:12px; }
    .metric strong { display:block; margin-top:3px; font-size:clamp(20px,3vw,29px); line-height:1.25; overflow-wrap:anywhere; }
    .table-wrap { overflow:auto; border:1px solid var(--line); border-radius:12px; }
    table { width:100%; min-width:860px; border-collapse:collapse; background:#08131f; }
    th,td { padding:11px 12px; border-bottom:1px solid #1a2b3e; text-align:left; vertical-align:top; }
    th { color:var(--muted); font-size:12px; font-weight:650; background:#0a1725; position:sticky; top:0; }
    tbody tr:last-child td { border-bottom:0; }
    .token-detail { color:var(--muted); font-size:12px; white-space:nowrap; }
    .status { display:inline-block; padding:2px 8px; border-radius:999px; background:#15372f; color:var(--brand); font-size:12px; }
    .status.failed { background:#3a1d27; color:var(--danger); }
    .compact-button { width:auto; padding:8px 13px; }
    @media(max-width:820px){ main{grid-template-columns:1fr}header{align-items:start;flex-direction:column}.row{grid-template-columns:1fr}.row button{width:100%}.summary-grid{grid-template-columns:repeat(2,minmax(0,1fr))} }
  </style>
</head>
<body>
  <header>
    <div><h1>AI 智能助理</h1><p>自动选择普通问答、知识库检索或 Agent 工具</p></div>
    <div id="health">正在检查服务…</div>
  </header>
  <main>
    <section>
      <div class="section-head"><h2>统一问答</h2><span id="route" class="badge">等待提问</span></div>
      <textarea id="question" placeholder="输入问题。例如：介绍 Go；从知识库查退款规则；计算 12×7 再加 16"></textarea>
      <div class="row"><span class="muted">Ctrl / ⌘ + Enter 发送，回答将实时显示</span><button id="askButton" onclick="ask()">发送</button></div>
      <div id="answer" class="output">系统会根据问题自动选择处理路径。</div>
      <div id="answerMeta" class="meta"></div>
      <div id="sources" class="detail"></div>
      <div id="tools" class="detail"></div>
    </section>
    <section>
      <div class="section-head"><h2>异步文档入库</h2><span class="badge">Kafka</span></div>
      <div class="stack">
        <input id="documentId" placeholder="文档 ID，例如 refund-policy">
        <textarea id="documentText" placeholder="粘贴需要入库的文档内容…"></textarea>
        <button id="ingestButton" onclick="ingest()">提交入库</button>
      </div>
      <div id="job" class="output">文档会异步切块、向量化并写入 Milvus。</div>
    </section>
    <section class="usage-section">
      <div class="section-head"><div><h2>Token 用量</h2><span id="usageUpdated" class="muted">正在加载…</span></div><button id="usageButton" class="compact-button" onclick="loadUsage()">刷新</button></div>
      <div class="summary-grid">
        <div class="metric"><span>累计 Token</span><strong id="totalTokens">—</strong></div>
        <div class="metric"><span>输入 Token</span><strong id="inputTokens">—</strong></div>
        <div class="metric"><span>输出 Token</span><strong id="outputTokens">—</strong></div>
        <div class="metric"><span>调用次数</span><strong id="totalCalls">—</strong></div>
      </div>
      <div class="table-wrap">
        <table>
          <thead><tr><th>时间</th><th>路径 / 类型</th><th>模型</th><th>Token</th><th>耗时</th><th>状态</th></tr></thead>
          <tbody id="usageRows"><tr><td colspan="6" class="muted">正在读取用量记录…</td></tr></tbody>
        </table>
      </div>
    </section>
  </main>
  <script>
    async function api(path,options={}){
      const response=await fetch(path,{headers:{'Content-Type':'application/json'},...options});
      const data=response.status===204?null:await response.json();
      if(!response.ok)throw new Error(data?.error?.message||`HTTP ${response.status}`);
      return data;
    }
    const element=id=>document.getElementById(id);
    const set=(id,text,error=false)=>{const el=element(id);el.textContent=text;el.classList.toggle('error',error)};
    const showDetail=(id,title,text)=>{const el=element(id);el.textContent=`${title}\n${text}`;el.classList.add('visible')};
    const hideDetail=id=>{const el=element(id);el.textContent='';el.classList.remove('visible')};
    const number=value=>new Intl.NumberFormat('zh-CN').format(Number(value)||0);

    function renderUsageRows(records){
      const body=element('usageRows');body.replaceChildren();
      if(!records.length){
        const row=document.createElement('tr'),cell=document.createElement('td');
        cell.colSpan=6;cell.className='muted';cell.textContent='暂时没有模型调用记录。';row.appendChild(cell);body.appendChild(row);return;
      }
      for(const record of records){
        const row=document.createElement('tr');
        const values=[
          new Date(record.created_at).toLocaleString('zh-CN',{hour12:false}),
          `${record.route||'—'}\n${record.operation}${record.call_index>1?` · 第 ${record.call_index} 次`:''}`,
          record.model||'—',
          '',
          `${number(record.duration_ms)} ms`,
          ''
        ];
        values.forEach((value,index)=>{const cell=document.createElement('td');cell.textContent=value;if(index===1)cell.style.whiteSpace='pre-line';row.appendChild(cell)});
        const tokenCell=row.children[3];
        const tokenTotal=document.createElement('strong');tokenTotal.textContent=number(record.total_tokens);tokenCell.appendChild(tokenTotal);
        const tokenDetail=document.createElement('div');tokenDetail.className='token-detail';tokenDetail.textContent=`输入 ${number(record.input_tokens)} · 输出 ${number(record.output_tokens)} · 缓存 ${number(record.cached_input_tokens)}`;tokenCell.appendChild(tokenDetail);
        const status=document.createElement('span');status.className=`status${record.status==='failed'?' failed':''}`;status.textContent=record.status==='completed'?'成功':`失败${record.error_code?` · ${record.error_code}`:''}`;row.children[5].appendChild(status);
        body.appendChild(row);
      }
    }

    async function loadUsage(){
      const button=element('usageButton');button.disabled=true;
      try{
        const data=await api('/v1/usage?limit=30'),summary=data.summary||{};
        set('totalTokens',number(summary.total_tokens));set('inputTokens',number(summary.input_tokens));set('outputTokens',number(summary.output_tokens));
        set('totalCalls',`${number(summary.total_calls)} 次`);renderUsageRows(data.records||[]);
        set('usageUpdated',`缓存输入 ${number(summary.cached_input_tokens)} · 成功 ${number(summary.completed_calls)} · 失败 ${number(summary.failed_calls)} · ${new Date().toLocaleTimeString('zh-CN',{hour12:false})}`);
      }catch(error){set('usageUpdated',error.message,true)}finally{button.disabled=false}
    }

    function refreshUsageSoon(){setTimeout(loadUsage,800)}

    async function ask(){
      const message=element('question').value.trim();
      if(!message){set('answer','请输入问题。',true);return}
      const button=element('askButton');button.disabled=true;
      set('route','正在判断路径…');set('answer','正在连接模型…');set('answerMeta','');hideDetail('sources');hideDetail('tools');
      let hasDelta=false;
      try{
        const response=await fetch('/v1/assistant/stream',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message})});
        if(!response.ok){const data=await response.json();throw new Error(data?.error?.message||`HTTP ${response.status}`)}
        if(!response.body)throw new Error('浏览器不支持流式响应');
        const reader=response.body.getReader(),decoder=new TextDecoder();let buffer='';
        while(true){
          const {value,done}=await reader.read();
          buffer+=decoder.decode(value||new Uint8Array(),{stream:!done});
          let boundary;
          while((boundary=buffer.indexOf('\n\n'))>=0){
            const block=buffer.slice(0,boundary);buffer=buffer.slice(boundary+2);
            if(!block.trim())continue;
            let event='message',data='';
            for(const line of block.split('\n')){
              if(line.startsWith('event:'))event=line.slice(6).trim();
              if(line.startsWith('data:'))data+=line.slice(5).trim();
            }
            const payload=data?JSON.parse(data):{};
            if(event==='route'){
              const labels={chat:'普通问答',rag:'知识库 RAG',agent:'工具 Agent'};
              set('route',labels[payload.path]||payload.path);
            }else if(event==='status'){
              if(!hasDelta)set('answer',`${payload.message}…`);
            }else if(event==='delta'){
              if(!hasDelta){set('answer','');hasDelta=true}
              element('answer').textContent+=payload.text||'';
            }else if(event==='sources'){
              const rows=payload.map(s=>`[${s.reference}] ${s.document_id}#${s.chunk_index} · ${Number(s.score).toFixed(3)}\n${s.text}`);
              showDetail('sources','检索来源',rows.join('\n\n'));
            }else if(event==='tools'){
              const rows=(payload.tool_calls||[]).map(t=>`步骤 ${t.step} · ${t.name}\n参数：${JSON.stringify(t.arguments)}\n结果：${JSON.stringify(t.output)}`);
              showDetail('tools',`工具轨迹 · 模型调用 ${payload.model_calls} 次`,rows.join('\n\n')||'未调用工具');
            }else if(event==='done'){
              const usage=payload.usage||{};
              set('answerMeta',`${payload.model||'模型'} · ${payload.duration_ms||0} ms · ${usage.total_tokens||0} tokens`);
              refreshUsageSoon();
            }else if(event==='error'){
              throw new Error(payload?.error?.message||'请求处理失败');
            }
          }
          if(done)break;
        }
      }catch(error){set('answer',error.message,true);set('answerMeta','')}
      finally{button.disabled=false}
    }

    async function ingest(){
      const button=element('ingestButton');button.disabled=true;
      try{
        set('job','正在提交…');
        const data=await api('/v1/knowledge/jobs',{method:'POST',body:JSON.stringify({document_id:element('documentId').value,text:element('documentText').value})});
        set('job',`任务 ${data.id}\n状态：${data.state}`);await poll(data.id);
      }catch(error){set('job',error.message,true)}finally{button.disabled=false}
    }
    async function poll(id){
      for(let i=0;i<60;i++){
        await new Promise(resolve=>setTimeout(resolve,1000));
        const data=await api(`/v1/knowledge/jobs/${id}`);
        set('job',`任务 ${data.id}\n状态：${data.state}${data.chunks?`\n切片：${data.chunks}`:''}${data.error?`\n错误：${data.error}`:''}`,data.state==='failed');
        if(['completed','failed'].includes(data.state)){refreshUsageSoon();return}
      }
      throw new Error('任务仍在处理，请稍后再次查询');
    }
    element('question').addEventListener('keydown',event=>{if(event.key==='Enter'&&(event.ctrlKey||event.metaKey)){event.preventDefault();ask()}});
    api('/readyz').then(data=>set('health',data.ready?'所有依赖正常':'部分依赖不可用',!data.ready)).catch(()=>set('health','服务不可用',true));
    loadUsage();
  </script>
</body>
</html>
