version: "2"
sql:
  - engine: "postgresql"
    schema: "migrations"
    queries: "internal/usage/db/query.sql"
    gen:
      go:
        package: "usagedb"
        out: "internal/usage/db/sqlc"
        sql_package: "pgx/v5"
        emit_json_tags: true
        overrides:
          - db_type: "uuid"
            go_type:
              import: "github.com/google/uuid"
              type: "UUID"
